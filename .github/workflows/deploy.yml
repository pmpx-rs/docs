# Build the site and publish it to GitHub Pages at https://pmpx.dev
#
# Pages must be set to "GitHub Actions" as its source in the repository settings; see the README.
# `public/CNAME` carries the custom domain, so it is copied into `dist/` by the build and travels
# with the artifact.
name: Deploy

on:
  push:
    branches: [main]
  # Lets a deploy be started by hand from the Actions tab, for a re-run after a DNS or
  # settings change that did not involve a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. `cancel-in-progress: false` on purpose: a half-finished deploy is
# worse than a queued one, and there is nothing to gain by cancelling a run that is nearly done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `lastUpdated: true` reads each page's commit date, which needs the full history rather
          # than the default single-commit clone. Without this every page shows the same date.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # `--frozen-lockfile` fails the build if `package.json` and the lockfile disagree, rather
      # than quietly resolving something else and deploying it.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Also runs the version plugin, which fetches the current pmpx release from crates.io and
      # falls back to its cache, then a built-in default, if crates.io is unreachable.
      - name: Build
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
